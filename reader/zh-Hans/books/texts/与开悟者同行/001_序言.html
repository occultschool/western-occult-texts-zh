    <h1 id="_1">序言</h1>
<p>以下心灵感应经历的描述，汇编自我一位朋友（相当有名望的作家）交给我的记录。至于其中的冒险是梦境，还是星光界的实际经验，我留给读者自行判断。</p>
<p>弗朗茨·哈特曼</p>
