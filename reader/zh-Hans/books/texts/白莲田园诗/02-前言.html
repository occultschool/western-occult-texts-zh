    <h1 id="_1">前言</h1>
<p>本书写的是一个贯穿古今、遍布各民族的故事。是关于灵魂的悲剧。灵魂因欲望而陷入罪恶，经痛苦而自省，在苦难后回归自我，转而寻求内在救赎之灵的帮助，并在最终牺牲中达到了神化，为人类带来祝福。这部启悟故事的语言温柔优美，印记著简朴与尊严的真实性。</p>
