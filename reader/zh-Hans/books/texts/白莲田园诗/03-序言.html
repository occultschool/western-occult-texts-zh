    <h1 id="_1">序言</h1>
<p>看哪，我孤零零地站在人群中。在团结的人群中，我是个孤体。我如此孤独，因为在所有认识的同胞中，只有我知晓且能教导他人。我受到那圣所中的力量驱使，在门口教导信徒。我无处可逃，因为在最神圣内殿深处的黑暗中，我看到了内在生命的光芒，并受驱使去揭示它，我也因此受到支持并变得强大。事实上，虽然我死了，但这动用了内殿的十个祭司才完成。即便如此，他们也无知地自认强大。</p>
