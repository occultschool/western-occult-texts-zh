    <h1 id="_1">昆虫的智慧</h1>
<p><strong>弟子</strong>问道：『谁拥有最伟大的<strong>智慧</strong>？』</p>
<p>『那些最有<strong>智慧</strong>的生物包括蚂蚁、蜜蜂、飞蛾和苍蝇。』</p>
<p>『为什么，亲爱的<strong>大师</strong>？』</p>
<p>『因为蚂蚁是盲的，看不见邪恶；蜜蜂是聋的，听不见邪恶；蛾子是哑的，说不出邪恶。』</p>
<p>『那么苍蝇呢？』</p>
<p>『苍蝇有千倍的眼睛，可以看到<strong>大自然</strong>的一切善和美；因为在一切事物中看到善良和美丽，才是最伟大的<strong>智慧</strong>！』</p>
<p><strong>李文和的一句格言</strong></p>
