    <h1 id="_1">仁慈的智慧</h1>
<p>仁慈的人是<strong>神</strong>在<strong>尘世</strong>上的代表。传播<strong>智慧</strong>就是获取<strong>智慧</strong>，并安住于<strong>平和</strong>之中；因为真正的智者周围，会显现一种造福他人的丰盛气象。</p>
<p>有谁听说过好斗的<strong>贵人</strong>吗？相反，他亲切地鼓励那些疲惫的尘世朝圣者，并且他的名字永远地铭刻在他们的心中。</p>
<p>我们无时无刻都能对别人行善；每一个善行、每一个善言、每一个明智的<strong>教导</strong>，都是对<strong>神灵</strong>的奉献，是对<strong>神</strong>的崇拜。</p>
<p><strong>李文和的一句格言</strong></p>
