    <h1 id="_1">论演戏</h1>
<p>我们应该始终全力以赴、严肃庄重地扮演诸神赋予我们的角色：无论是伟大还是微不足道的。</p>
<p>当我们的观众凝视著我们的扭曲镜像时，看见我们的行为，听见我们的话语，仿佛我们虚构之事即为现实，而激情只是一个梦境。</p>
<p>让我们的言辞如同充满甜蜜的蜜酒，取悦味蕾，留下美好的余韵；而那些喜欢醋味的人，就让他们尽情沉浸在酸涩滋味中吧。</p>
<p><strong>李文和的一句格言</strong></p>
