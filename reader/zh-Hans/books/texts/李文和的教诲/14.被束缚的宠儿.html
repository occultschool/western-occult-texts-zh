    <h1 id="_1">被束缚的宠儿</h1>
<p><strong>宠儿</strong>是那些能够吸引卓越人士目光，或获得神灵关注的人。俗话说，接受恩惠就等于出卖自己的自由。但是，如果我们接受恩惠并连本带利回馈，我们将扩大自己的自由。</p>
<p>如果一个人给另一人千百个大恩惠，然后拒绝他一个小小的请求，那么他只会记住这最后的拒绝。</p>
<p>因此，如果我们希望维持宠儿对我们的好感，就没有停止给予恩惠的一天。</p>
<p>但是，如果一个宠儿失去了恩人的青睐，他的地位将比最初得到善意之前更低——无论这个恩人是神灵还是人。</p>
<p><strong>李文和的一句格言</strong></p>
