    <h1 id="_1">致献</h1>
<p>致那辉煌的星辰—————
在那<strong>尖塔</strong>上闪耀著光芒，<strong>夜幕</strong>低垂
坐于皇家橡树下的山丘上，
想像的<strong>火炬</strong>
交到了不确定的手中
哦！愿这使者配得上这份<strong>信任</strong>，
愿<strong>灵感</strong>之光如繁星般灿烂闪耀……
于<strong>召唤</strong>之声响起时！</p>
