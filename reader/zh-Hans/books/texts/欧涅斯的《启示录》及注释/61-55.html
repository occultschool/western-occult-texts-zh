    <h1 id="55">55.</h1>
<p>羔羊揭开第六印的时候，大地持续发生剧烈的地震；太阳变黑，如同粗毛麻布；整个月亮变得如血般；天上的星辰坠落到地上，如无花果树被大风摇动，未熟的果子纷纷掉落。地上的众王、首领、千夫长、富人、壮士、以及奴仆和自由人，都藏身在山洞和岩穴中。他们对山和洞穴说：「倒在我们身上吧，把我们藏起来，我们不想面对宝座上的面容与羔羊的愤怒，因为祂大怒的日子已经到来，谁能承受得住呢？」</p>
<p>注释： </p>
<p>第六印的开启。</p>
