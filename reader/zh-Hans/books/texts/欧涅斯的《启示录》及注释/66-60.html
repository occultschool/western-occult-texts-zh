    <h1 id="60">60.</h1>
<p>到了那时，米迦勒将起身，他是众王子中最有能力者；这将是一段空前的艰难时期，自地球上有国家以来从未有过。凡名字被记在书上的人必得救；许多长眠尘土中的人必苏醒复活，有的得永生，有的则受永远的痛苦与羞辱。智者必如穹苍的光辉照耀，正义之人必如亘古星辰。凡名字未被记在生命之书上的，都将被扔进火湖之中。</p>
<p>注释：</p>
<p>众生轮回之日 </p>
