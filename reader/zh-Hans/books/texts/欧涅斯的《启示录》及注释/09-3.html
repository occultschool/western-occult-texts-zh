    <h1 id="3">3.</h1>
<p>我见一只手向我伸来，手持一卷书，在我面前展开，书上写著过去的事；也写著哀号、悲伤和灾祸。他对我说：「人子啊，站起来，我要与你说话；你要吃下这书卷。」于是此灵来到我身上，使我振奋，将我扶起，让我站立，我听见他对我说话，他打开我的口，让我吃下那卷书，又对我说：「人子啊，吃下这书卷，让你的肚腹充满我所赐予你的书卷。」我便吃了，口中觉得甘甜如蜜。</p>
<p>注释：
先知的启悟 
此时将《启示录》的象征展示给先知，并命其吃下此书，使之成为自身的一部分。</p>
