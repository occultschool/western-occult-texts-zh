    <h1 id="68">68.</h1>
<p>接著，智天使展开了翅膀，与其相连的轮子也升起；上帝的荣耀在他们之上；主的荣耀从城中升起，停留在城对面的山上。
注释：
圣城的荣耀
信使首次瞥见圣母圣城后，随即目睹其最辉煌的荣耀。智天使带著星辰般的轮子升起，照亮了圣城；上帝的荣耀——即圣灵本身——以光辉洪流沐浴了此城，使灵炫目；一道来自上帝本身的光芒从城市中央发出，停留在一座山上，从山顶倾泻奇异光辉，凡人双眼前所未见。</p>
