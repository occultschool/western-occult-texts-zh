    <h1 id="63">63.</h1>
<p>看哪，有一位如人子的，驾著天界的云而来，站在亘古常在者面前；他们领他到那位面前。他被赐予了权柄、荣耀和国度，且万民、万族、万方言都事奉他；其权柄是永远的权柄，永不废去；其国度也必不被毁灭。其身体如绿柱石，面如闪电，眼睛如炬，手臂和双脚如光耀的铜，说话如群众之声。</p>
<p>注释：
信使向上帝认领其信众
此处展现了信使从尘世升到天界后的形象，即象征性的赫尔墨斯或救世主，代表十位中的任何一位或全部。他引领追随者进入星辰光辉之境，与其本性相契合。</p>
