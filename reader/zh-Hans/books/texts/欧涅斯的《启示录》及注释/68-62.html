    <h1 id="62">62.</h1>
<p>接著有一位对我说：「成了！我是AO——最初与最末。我要把生命之水的泉源无偿赐给口渴之人。得胜者将继承一切：我要作他的神，他要作我的儿子。至于懦弱无信、可憎灵魂、凶手、污秽者、巫师、偶像崇拜者和所有说谎者，将在火与硫磺的湖中受惩，这就是第二次死亡。」</p>
<p>注释：</p>
<p>圣灵的异象。</p>
