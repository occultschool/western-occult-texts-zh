    <h1 id="_1">序言</h1>
<p>看哪，我孤零零地站在人群中。在團結的人群中，我是個孤體。我如此孤獨，因為在所有認識的同胞中，只有我知曉且能教導他人。我受到那聖所中的力量驅使，在門口教導信徒。我無處可逃，因為在最神聖內殿深處的黑暗中，我看到了內在生命的光芒，並受驅使去揭示它，我也因此受到支持並變得強大。事實上，雖然我死了，但這動用了內殿的十個祭司才完成。即便如此，他們也無知地自認強大。</p>
