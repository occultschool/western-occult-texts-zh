    <h1 id="_1">前言</h1>
<p>本書寫的是一個貫穿古今、遍布各民族的故事。是關於靈魂的悲劇。靈魂因慾望而陷入罪惡，經痛苦而自省，在苦難後回歸自我，轉而尋求內在救贖之靈的幫助，並在最終犧牲中達到了神化，為人類帶來祝福。這部啟悟故事的語言溫柔優美，印記著簡樸與尊嚴的真實性。</p>
