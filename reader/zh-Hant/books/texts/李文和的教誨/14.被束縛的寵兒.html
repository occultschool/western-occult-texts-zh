    <h1 id="_1">被束縛的寵兒</h1>
<p><strong>寵兒</strong>是那些能夠吸引卓越人士目光，或獲得神靈關注的人。俗話說，接受恩惠就等於出賣自己的自由。但是，如果我們接受恩惠並連本帶利回饋，我們將擴大自己的自由。</p>
<p>如果一個人給另一人千百個大恩惠，然後拒絕他一個小小的請求，那麼他只會記住這最後的拒絕。</p>
<p>因此，如果我們希望維持寵兒對我們的好感，就沒有停止給予恩惠的一天。</p>
<p>但是，如果一個寵兒失去了恩人的青睞，他的地位將比最初得到善意之前更低——無論這個恩人是神靈還是人。</p>
<p><strong>李文和的一句格言</strong></p>
