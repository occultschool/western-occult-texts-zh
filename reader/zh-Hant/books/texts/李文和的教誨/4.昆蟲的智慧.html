    <h1 id="_1">昆蟲的智慧</h1>
<p><strong>弟子</strong>問道：『誰擁有最偉大的<strong>智慧</strong>？』</p>
<p>『那些最有<strong>智慧</strong>的生物包括螞蟻、蜜蜂、飛蛾和蒼蠅。』</p>
<p>『為什麼，親愛的<strong>大師</strong>？』</p>
<p>『因為螞蟻是盲的，看不見邪惡；蜜蜂是聾的，聽不見邪惡；蛾子是啞的，說不出邪惡。』</p>
<p>『那麼蒼蠅呢？』</p>
<p>『蒼蠅有千倍的眼睛，可以看到<strong>大自然</strong>的一切善和美；因為在一切事物中看到善良和美麗，才是最偉大的<strong>智慧</strong>！』</p>
<p><strong>李文和的一句格言</strong></p>
