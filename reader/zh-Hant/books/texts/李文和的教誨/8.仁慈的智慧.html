    <h1 id="_1">仁慈的智慧</h1>
<p>仁慈的人是<strong>神</strong>在<strong>塵世</strong>上的代表。傳播<strong>智慧</strong>就是獲取<strong>智慧</strong>，並安住於<strong>平和</strong>之中；因為真正的智者周圍，會顯現一種造福他人的豐盛氣象。</p>
<p>有誰聽說過好鬥的<strong>貴人</strong>嗎？相反，他親切地鼓勵那些疲憊的塵世朝聖者，並且他的名字永遠地銘刻在他們的心中。</p>
<p>我們無時無刻都能對別人行善；每一個善行、每一個善言、每一個明智的<strong>教導</strong>，都是對<strong>神靈</strong>的奉獻，是對<strong>神</strong>的崇拜。</p>
<p><strong>李文和的一句格言</strong></p>
