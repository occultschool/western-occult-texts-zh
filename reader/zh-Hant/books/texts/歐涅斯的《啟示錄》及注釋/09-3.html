    <h1 id="3">3.</h1>
<p>我見一隻手向我伸來，手持一卷書，在我面前展開，書上寫著過去的事；也寫著哀號、悲傷和災禍。他對我說：「人子啊，站起來，我要與你說話；你要吃下這書卷。」於是此靈來到我身上，使我振奮，將我扶起，讓我站立，我聽見他對我說話，他打開我的口，讓我吃下那卷書，又對我說：「人子啊，吃下這書卷，讓你的肚腹充滿我所賜予你的書卷。」我便吃了，口中覺得甘甜如蜜。</p>
<p>注釋：
先知的啟悟 
此時將《啟示錄》的象徵展示給先知，並命其吃下此書，使之成為自身的一部分。</p>
