    <h1 id="62">62.</h1>
<p>接著有一位對我說：「成了！我是AO——最初與最末。我要把生命之水的泉源無償賜給口渴之人。得勝者將繼承一切：我要作他的神，他要作我的兒子。至於懦弱無信、可憎靈魂、兇手、污穢者、巫師、偶像崇拜者和所有說謊者，將在火與硫磺的湖中受懲，這就是第二次死亡。」</p>
<p>注釋：</p>
<p>聖靈的異象。</p>
