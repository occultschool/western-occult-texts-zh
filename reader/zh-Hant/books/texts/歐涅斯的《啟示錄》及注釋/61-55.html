    <h1 id="55">55.</h1>
<p>羔羊揭開第六印的時候，大地持續發生劇烈的地震；太陽變黑，如同粗毛麻布；整個月亮變得如血般；天上的星辰墜落到地上，如無花果樹被大風搖動，未熟的果子紛紛掉落。地上的眾王、首領、千夫長、富人、壯士、以及奴僕和自由人，都藏身在山洞和巖穴中。他們對山和洞穴說：「倒在我們身上吧，把我們藏起來，我們不想面對寶座上的面容與羔羊的憤怒，因為祂大怒的日子已經到來，誰能承受得住呢？」</p>
<p>注釋： </p>
<p>第六印的開啟。</p>
