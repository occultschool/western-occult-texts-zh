    <h1 id="68">68.</h1>
<p>接著，智天使展開了翅膀，與其相連的輪子也升起；上帝的榮耀在他們之上；主的榮耀從城中升起，停留在城對面的山上。
注釋：
聖城的榮耀
信使首次瞥見聖母聖城後，隨即目睹其最輝煌的榮耀。智天使帶著星辰般的輪子升起，照亮了聖城；上帝的榮耀——即聖靈本身——以光輝洪流沐浴了此城，使靈炫目；一道來自上帝本身的光芒從城市中央發出，停留在一座山上，從山頂傾瀉奇異光輝，凡人雙眼前所未見。</p>
