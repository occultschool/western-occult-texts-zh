    <h1 id="63">63.</h1>
<p>看哪，有一位如人子的，駕著天界的雲而來，站在亙古常在者面前；他們領他到那位面前。他被賜予了權柄、榮耀和國度，且萬民、萬族、萬方言都事奉他；其權柄是永遠的權柄，永不廢去；其國度也必不被毀滅。其身體如綠柱石，面如閃電，眼睛如炬，手臂和雙腳如光耀的銅，說話如群眾之聲。</p>
<p>注釋：
信使向上帝認領其信眾
此處展現了信使從塵世升到天界後的形象，即象徵性的赫爾墨斯或救世主，代表十位中的任何一位或全部。他引領追隨者進入星辰光輝之境，與其本性相契合。</p>
