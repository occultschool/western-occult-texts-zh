    <h1 id="60">60.</h1>
<p>到了那時，米迦勒將起身，他是眾王子中最有能力者；這將是一段空前的艱難時期，自地球上有國家以來從未有過。凡名字被記在書上的人必得救；許多長眠塵土中的人必甦醒復活，有的得永生，有的則受永遠的痛苦與羞辱。智者必如穹蒼的光輝照耀，正義之人必如亙古星辰。凡名字未被記在生命之書上的，都將被扔進火湖之中。</p>
<p>注釋：</p>
<p>眾生輪迴之日 </p>
