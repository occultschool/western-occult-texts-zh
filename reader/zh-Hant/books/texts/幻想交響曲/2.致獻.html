    <h1 id="_1">致獻</h1>
<p>致那輝煌的星辰—————
在那<strong>尖塔</strong>上閃耀著光芒，<strong>夜幕</strong>低垂
坐於皇家橡樹下的山丘上，
想像的<strong>火炬</strong>
交到了不確定的手中
哦！願這使者配得上這份<strong>信任</strong>，
願<strong>靈感</strong>之光如繁星般燦爛閃耀……
於<strong>召喚</strong>之聲響起時！</p>
